const FEEOF=()=>BERRY.fees[START]||0,STARTL=()=>S.challengeId?'Continue account':FEEOF()?'Start for '+mm(FEEOF()):'Start free test account',sold=()=>{const f=FEEOF();if(f){S.sales.push({s:START,f});S.pool.inp=+(S.pool.inp+f).toFixed(2)}};
const rulesRows=()=>R('Account',m0(START)+' evaluation account')+R('Access',FEEOF()?mm(FEEOF())+' · paid once':'Free test account')+R('Profit target',m0(START*.1)+' · net of costs')+R('Daily loss limit',m0(DAILY)+' · from UTC day start')+R('Max loss','Fails below '+m0(FLOOR))+R('Trading days','3 UTC days with a trade')+R('Payout',PAYT());
const paymentText=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const paymentSheet=p=>{
 const asset=p.originAsset==='nep141:wrap.near'?'NEAR':String(p.originAsset||'').split(':').pop();
 const amount=paymentText(p.amountInFormatted),deposit=paymentText(p.depositAddress);
 return sheet(`<div class="t2">Complete challenge payment</div><div class="mu">Send the quoted amount. Your account starts after NEAR Intents confirms delivery.</div><div style="margin-top:12px">${R('Challenge fee',mm(p.fee)+' in USDC')+R('Pay with',paymentText(asset)+' · NEAR Intents mainnet')+R('Evaluation',paymentText(p.evaluationNetwork))+R('Refund account',paymentText(p.refundTo||'Your NEAR account'))}</div>${amount?`<div class="card" style="margin-top:12px"><b>Send ${amount} ${paymentText(asset)}</b><div class="mu sm" style="margin-top:4px">Exact quoted amount</div></div>`:`<div class="mu sm" style="margin-top:12px">Follow the exact amount shown by the NEAR Intents quote.</div>`}<div class="card" style="margin-top:12px;overflow-wrap:anywhere"><div class="mu sm">Deposit address</div><b>${deposit}</b>${p.depositMemo?`<div class="mu sm" style="margin-top:6px">Memo: ${paymentText(p.depositMemo)}</div>`:''}</div><div class="two" style="margin-top:14px"><button class="btn g" data-copy="${deposit}" onclick="copyTxt(this.dataset.copy,'Address copied')">Copy address</button>${p.status==='pending'?`<button class="btn" onclick="BerryAPI.checkChallengePayment('${paymentText(p.id)}')">Check payment</button>`:`<button class="btn g" disabled>${paymentText(p.providerStatus||p.status)}</button>`}</div><a class="lk" href="${paymentText(p.explorerUrl||'https://explorer.near-intents.org/')}" target="_blank" rel="noopener noreferrer">Open NEAR Intents explorer ↗</a>`)
};
const acceptConfirm=()=>{if(serverNeeded())return;if(S.challengeId){go('home');toast('Account ready');return}if(BerryAPI.online){if(S.challengePayment?.status==='pending')return paymentSheet(S.challengePayment);if(FEEOF()&&S.nearIntentsConfigured){const refund=$('#refundAccount')?.value.trim();if(!refund)return toast('Enter a mainnet refund account','warn');return BerryAPI.payChallenge(START,refund)}if(FEEOF()&&S.rail!=='mock')return toast('Payment checkout is not configured','warn');return BerryAPI.createChallenge(START)}PRE.fresh();sold();go('home');toast('Free test account started')};
const accept=()=>{if(S.challengeId)return go('home');if(S.cfg.halt)return toast('New challenges are paused','warn');const checkout=FEEOF()&&S.nearIntentsConfigured?`<label class="mu sm" for="refundAccount" style="display:block;margin-top:14px">NEAR mainnet refund account<input id="refundAccount" autocomplete="off" autocapitalize="none" placeholder="your-account.near" style="display:block;width:100%;margin-top:6px"></label><div class="mu sm" style="margin-top:8px">Payment is on NEAR Intents mainnet. The evaluation runs on ${S.rail==='testnet'?'NEAR testnet':'NEAR mainnet'}.</div>`:'';sheet(`<div class="t2">Accept Rules v1</div><div class="mu">Your challenge follows these rules from the first trade.</div><div style="margin-top:10px">${rulesRows()}</div>${checkout}<button class="btn" style="margin-top:18px" onclick="acceptConfirm()">${S.challengePayment?.status==='pending'?'Resume payment':FEEOF()?S.nearIntentsConfigured?'Continue to payment · '+mm(FEEOF()):'Accept and pay '+mm(FEEOF()):'Start free test account'}</button>`)};

 const sel=`<div class="seg" style="margin:0 0 12px" role="group" aria-label="Account size">${on.map(s=>`<button class="${s==START?'on':''}" onclick="pickSize(${s})">$${s/1000}K</button>`).join('')}</div>

 const rows=`<div class="tight" style="margin-top:10px">${R('Challenge fee',FEEOF()?mm(FEEOF())+' · paid once':'Free')+R('Profit target',m0(START*.1)+' · 10%')+R('Daily loss limit',m0(DAILY)+' · 5%')+R('Max loss',m0(START*.1)+' · 10%')+R('Min trading days','3')+R('Payout',PCT()+' of profit','up to '+CAPM()+' per account')}</div>

D.home=()=>{
 const n=S.pos.length,F=S.stage=='funded';
 if(n)return{h:`<button class="btn" onclick="${n>1?"go('markets')":'manage(0)'}">Manage trade${n>1?'s':''}</button>`};
 if(F)return S.pay=='idle'&&est()>0?{h:`<button class="btn" onclick="reqSheet()">Request payout</button>`}:null;
 return S.days==0?{h:`<button class="btn" onclick="go('markets')">Place your first trade</button>`}:null};
const sd=(d,m)=>(d<0?'−':'+')+dd(d,m);
const why=()=>{
 const u=Math.max(0,-(S.rl+flt())),p=S.pos[0];
 if(u<.005)return sheet(`<div class="t2">Daily loss limit</div><div class="mu">You haven't lost anything today, so the full ${mm(DAILY)} is available.</div><div style="margin-top:10px">${R('Limit',m0(DAILY)+' · 5% of '+m0(START))+R('Resets','00:00 UTC')}</div>`);
 if(!p)return sheet(`<div class="t2">Daily loss limit</div><div class="mu">Your closed trades lost ${mm(u)} today.</div><div style="margin-top:10px">${R('Left today',mm(dayLeft()))+R('Resets','00:00 UTC')}</div>`);
 if(S.pos.length>1)return sheet(`${AIL}<div class="t2">Why is your daily loss ${mm(u)}?</div><div class="mu">Your open trades are ${flt()<0?'down':'up'} ${mm(Math.abs(flt()))} together.</div><div style="margin-top:10px">${S.pos.map(q=>R(MP(q).s+' · '+q.side,`<span class="${pl(q)<0?'rd':'gn'}">${sg(pl(q))}</span>`)).join('')+R('If your stop losses are hit',mm(left2())+' left today')}</div>${chips(['Rules v1','12:04 UTC'])}<div class="two"><button class="btn g" onclick="go('help')">Ask a question</button><button class="btn" onclick="shut();go('markets')">Manage trades</button></div>`);
 const m=MP(p);
 sheet(`${AIL}<div class="t2">Why is your daily loss ${mm(u)}?</div><div class="mu">${m.s.split('/')[0]} moved ${dd(m.p-p.e,m)} against you since you ${p.side=='Buy'?'bought':'sold'}.</div><div style="margin-top:10px">${R(`${sd((m.p-p.e)*dir(p),m)} × ${zf(p.z,m)}`,`<span class="rd">${sg(pl(p))}</span>`)+R('If your stop loss is hit',mm(left2())+' left today')}</div>${chips(['Trade #6','Rules v1','12:04 UTC'])}<div class="two"><button class="btn g" onclick="go('help')">Ask a question</button><button class="btn" onclick="shut();manage(0)">Manage trade</button></div>`)};
const whyMax=()=>sheet(`<div class="t2">Max loss</div><div class="mu">Your account fails if equity drops below ${m0(FLOOR)}. Recovering afterwards does not undo it.</div><div style="margin-top:10px">${R('Equity',mm(eq()))+R('Fails below',m0(FLOOR))+R('Left',mm(eq()-FLOOR))}</div>`);
/* ---------- Manage a position ---------- */
const manage=(i=0)=>{const p=S.pos[i];if(!p)return toast('No open trade','info');const m=MP(p);M={i,tab:M.tab||'Stop loss',sl:p.sl==null?+(m.p-m.sd*dir(p)).toFixed(m.dp):p.sl,fr:.5};mg()};
const mgT=t=>{M.tab=t;mg()};
const mgF=f=>{M.fr=f;mg()};
const mgSL=d=>{const p=S.pos[M.i],m=MP(p);let n=M.sl+d;n=dir(p)>0?Math.min(n,m.p-m.st):Math.max(n,m.p+m.st);M.sl=+n.toFixed(m.dp);mg()};
const setSL=()=>{const p=S.pos[M.i],m=MP(p);if(serverNeeded())return;if(BerryAPI.online&&p.id)return BerryAPI.updatePosition(p.id,M.sl);p.sl=M.sl;shut();draw();toast(m.s+' stop loss set · '+tk(M.sl,m))};
const closePos=(i,f)=>{
 const p=S.pos[i],m=MP(p),xp=m.p*(p.side=='Buy'?1-SLIP:1+SLIP),q=p.z*f,r=(xp-p.e)*q*dir(p),fee=q*xp*FEE;
 if(serverNeeded())return;if(BerryAPI.online&&p.id)return BerryAPI.closePosition(p.id,f);
 S.bal+=r-fee;S.rl+=r-fee;S.ord.unshift([p.side=='Buy'?'Sell':'Buy',+q.toFixed(4),xp,'just now',p.m||'BTC']);
 if(f>=.999)S.pos.splice(i,1);else p.z=+(p.z-q).toFixed(4);
 shut();draw();toast((f>=.999?'Closed ':'Partly closed ')+m.s+' · '+sg(r-fee))};
const mg=()=>{
 const p=S.pos[M.i],m=MP(p),b=dir(p),xp=m.p*(b>0?1-SLIP:1+SLIP);let body='';
 if(M.tab=='Stop loss'){
  const cur=lossAt(p),nl=Math.max(0,(p.e-M.sl)*p.z*b),after=DAILY-Math.max(0,wr()-cur+nl-S.rl);
  body=`<div class="r" style="min-height:72px"><span class="k">New stop loss</span><span class="stp"><b>${tk(M.sl,m)}</b><button aria-label="Lower stop loss" onclick="mgSL(-${m.st})">${I('minus',18)}</button><button aria-label="Raise stop loss" onclick="mgSL(${m.st})">${I('plus',18)}</button></span></div>${R('Loss at stop (estimate)',`${mm(cur)} → <span class="rd">${mm(nl)}</span>`)+R('Daily loss left if hit',`${mm(left2())} → ${mm(after)}`)}<div class="mu sm" style="margin:12px 0 0">Stops fill at the next available price, which can differ from your stop.</div><button class="btn" style="margin-top:16px" onclick="setSL()">Update stop loss</button>`}
 else if(M.tab=='Partial close'){
  const q=+(p.z*M.fr).toFixed(4),rs=(xp-p.e)*q*b-q*xp*FEE;
  body=`<div class="tf" style="margin:12px 0 0">${[.25,.5,.75].map(f=>`<button class="${f==M.fr?'on':''}" onclick="mgF(${f})">${Math.round(f*100)}%</button>`).join('')}</div>${R('Closes',zf(q,m))+R('Result (estimate)',`<span class="${rs<0?'rd':'gn'}">${sg(rs)}</span>`)+R('Stays open',zf(+(p.z-q).toFixed(4),m))}<button class="btn" style="margin-top:16px" onclick="closePos(${M.i},${M.fr})">Close ${Math.round(M.fr*100)}%</button>`}
 else{
  const rs=(xp-p.e)*p.z*b-p.z*xp*FEE;
  body=`${R('Closes at','≈ '+pf(xp,m))+R('Fee · 5 bps','$'+f2(p.z*xp*FEE))+R('Result (estimate)',`<span class="${rs<0?'rd':'gn'}">${sg(rs)}</span>`)}<button class="btn" style="margin-top:16px" onclick="closePos(${M.i},1)">Close position</button>`}
 sheet(`<div class="t2">${m.s}</div><div class="mu">${p.side} · ${zf(p.z,m)} · entry ${tk(p.e,m)}</div><div class="seg" style="margin-top:14px">${['Stop loss','Partial close','Close'].map(t=>`<button class="${t==M.tab?'on':''}" onclick="mgT('${t}')">${t}</button>`).join('')}</div>${body}`)};
/* ---------- Markets: the Trade tab opens here ---------- */
const pick=k=>{if(DT()){S.m=k;newT(k);draw()}else go('trade',{m:k})};
const mrow=k=>{const m=MK[k];return`<button class="r${DT()&&k==S.m?' sel':''}" style="min-height:68px" onclick="pick('${k}')">${mi(k,44,held(k))}<span class="nm">${m.s}<small>${m.n}</small></span><b class="v">${pf(m.p,m)}<small>${chg(k)}</small></b></button>`};
const mfind=()=>{const t=(S.mq||'').toLowerCase().trim();return Object.keys(MK).filter(k=>mon(k)&&(S.mc=='All'||MK[k].c==S.mc)&&(!t||(MK[k].s+' '+MK[k].n+' '+k+' '+MK[k].c).toLowerCase().includes(t)))};
const mlist=()=>{const ks=mfind();return ks.length?CATS.map(c=>{const a=ks.filter(k=>MK[k].c==c);return a.length?`<div class="sec">${c}<span class="mu sm">${a.length}</span></div>${a.map(mrow).join('')}`:''}).join(''):EMP('No markets match','Try another name or category.')};
const msearch=v=>{S.mq=v;$('#ml').innerHTML=mlist()};
const mcat=c=>{S.mc=c;draw()};
const mpane=()=>{
 const cats=['All',...CATS.filter(c=>Object.keys(MK).some(k=>MK[k].c==c&&mon(k)))];
 return`<label class="in sr">${I('search',20)}<input id="ms" value="${S.mq}" oninput="msearch(this.value)" placeholder="Search markets" autocomplete="off" aria-label="Search markets"></label>
<div class="pills">${cats.map(c=>`<button class="${c==S.mc?'on':''}" onclick="mcat('${c}')">${c}</button>`).join('')}</div>
${S.pos.length&&!S.mq&&S.mc=='All'?`<div class="sec" style="margin-top:8px">Open trades<span class="mu sm">${S.pos.length}</span></div>${S.pos.map(posRow).join('')}`:''}<div id="ml">${mlist()}</div>`};
V.markets=()=>DT()?mkt():`${hdr(1)}<h1 style="margin:4px 0 14px">Markets</h1>${mpane()}
<div class="mu sm" style="margin-top:18px">Each fill pays a 5 bps fee and 2 bps slippage.</div>`;
const mswitch=()=>sheet(`<div class="t2">Switch market</div>${CATS.map(c=>{const a=Object.keys(MK).filter(k=>MK[k].c==c&&mon(k));return a.length?`<div class="sec" style="font-size:15px;color:var(--mu);margin-top:14px">${c}</div>${a.map(k=>`<button class="r" style="min-height:58px" onclick="pick('${k}')">${mi(k,36,held(k))}<span class="nm">${MK[k].s}</span><b class="v">${pf(MK[k].p,MK[k])}<small>${chg(k)}</small></b></button>`).join('')}`:''}).join('')}`);
/* ---------- Market detail ---------- */
const mv=(c,m,full,mt)=>`<div class="sb" style="margin:${mt}px 0 0"><span class="${c.d<0?'rd':'gn'}">${c.d<0?'▼':'▲'} ${full?dd(c.d,m)+' ('+Math.abs(c.p).toFixed(1)+'%)':Math.abs(c.p).toFixed(1)+'%'}</span> <span class="mu" style="font-weight:500">today</span></div>`;
const about=m=>R('Market',m.n)+R('Size step',zf(m.zs,m))+R('Fee','5 bps per fill')+R('Slippage','2 bps against you')+R('Max exposure','2× your equity')+R('Stops','Fill at the next available price')+R('Evaluation scope','Rule-based fills, no external order book');
const ordRow=o=>{const m=MK[o[4]||'BTC'];return`<div class="r" style="min-height:64px"><span class="nm" style="margin:0">${o[0]} ${zf(o[1],m)}<small>${o[3]}</small></span><b class="v">${pf(o[2],m)}<small>Filled</small></b></div>`};
V.trade=()=>{
 const k=S.m,m=MK[k],c=dchg(k),mine=S.pos.filter(p=>(p.m||'BTC')==k),oo=S.ord.filter(o=>(o[4]||'BTC')==k);
 const b=S.tab=='Position'?(mine.length?mine.map(p=>posRow(p,S.pos.indexOf(p))).join(''):EMP('No open trades','Tap Buy or Sell to place one.')):S.tab=='Orders'?(oo.length?oo.map(ordRow).join(''):EMP('No orders yet','Your fills show up here.')):about(m);
 return`<div class="bar">${BK('markets')}<button class="ttl" onclick="mswitch()" aria-label="Switch market">${mi(k,32,held(k))}<span>${m.s}<small>${m.n}</small></span><span class="mu" style="display:flex">${I('down',18)}</span></button></div>
<div class="big" style="margin-top:6px">${hp(m.p,m)}</div>${mv(c,m,1,10)}
${candles({sl:mine.length?mine[0].sl:null})}<div class="tf">${TFS.map((t,i)=>`<button class="${i==S.tf?'on':''}" onclick="S.tf=${i};draw()">${t[0]}</button>`).join('')}<span class="sp" aria-hidden="true">${I('candle',22)}</span></div>
<div class="two" style="margin:0 0 14px"><div class="card col"><div class="mu sm">Daily loss left</div><b>${mm(dayLeft())}</b></div><div class="card col"><div class="mu sm">Max loss left</div><b>${mm(eq()-FLOOR)}</b></div></div>
<div class="tabs">${['Position','Orders','About'].map(t=>`<button class="${t==S.tab?'on':''}" onclick="S.tab='${t}';draw()">${t}</button>`).join('')}</div>${b}`};
D.trade=()=>paused()?{c:'col',h:`<div class="mu sm">Trading is paused while your payout is open.</div>`}:{h:`<button class="btn sell" onclick="openOrder('Sell')">Sell</button><button class="btn buy" onclick="openOrder('Buy')">Buy</button>`};
/* ---------- Order ticket ---------- */
const slAt=(m,s)=>+(m.p+(s=='Buy'?-1:1)*m.sd).toFixed(m.dp);
const newT=(k,s='Buy')=>{const m=MK[k];T={m:k,side:s,z:m.z0,sl:slAt(m,s),tp:null}};
const openOrder=s=>{if(paused())return toast('Trading is paused while your payout is open','warn');newT(S.m,s);go('order')};
const side=s=>{if(s!=T.side){T.side=s;T.sl=slAt(MK[T.m],s);T.tp=null}T.touch=1;draw()};
const st=(f,d)=>{const m=MK[T.m];if(f=='z')T.z=Math.max(m.zs,+(T.z+d).toFixed(4));else{const b=T.side=='Buy'?1:-1;let n=T[f]+d;n=f=='sl'?(b>0?Math.min(n,m.p-m.st):Math.max(n,m.p+m.st)):(b>0?Math.max(n,m.p+m.st):Math.min(n,m.p-m.st));T[f]=+n.toFixed(m.dp)}T.touch=1;draw()};
const addTP=()=>{const m=MK[T.m];T.tp=+(m.p+(T.side=='Buy'?2:-2)*m.sd).toFixed(m.dp);T.touch=1;draw()};
const stp=(k,v,f,d,sub)=>`<div class="r" style="min-height:76px"><span class="k">${k}${sub?`<span class="mu sm" style="display:block;font-weight:500">${sub}</span>`:''}</span><span class="stp"><b>${v}</b><button aria-label="Decrease ${k}" onclick="st('${f}',-${d})">${I('minus',18)}</button><button aria-label="Increase ${k}" onclick="st('${f}',${d})">${I('plus',18)}</button></span></div>`;
const orderBad=()=>T.z>maxZ(T.m)+1e-9?'Bigger than your 2× limit allows':tLeft()<0?'Stop is beyond your daily loss limit':'';
const tbody=()=>{
 const m=MK[T.m],bad=orderBad(),bu=T.side=='Buy';
 return`<div class="seg"><button class="${bu?'on':''}" onclick="side('Buy')">Buy</button><button class="${bu?'':'on sell'}" onclick="side('Sell')">Sell</button></div>
${stp('Size',zf(T.z,m),'z',m.zs)}${stp('Stop loss',tk(T.sl,m),'sl',m.st)}
${T.tp==null?`<div class="r" style="min-height:64px"><span class="k">Take profit</span><button class="v bl" onclick="addTP()">Add</button></div>`:stp('Take profit',tk(T.tp,m),'tp',m.st,`+${mm(Math.abs(T.tp-m.p)*T.z)} if hit · <button class="bl" onclick="T.tp=null;draw()">Remove</button>`)}
<div class="risk">${I('shield',26)}<span>${bad?`<span class="am">${bad}</span>`:`Risk ${mm(tRisk())} · daily loss left ${mm(tLeft())}`}</span></div>`};
V.order=()=>{
 const m=MK[T.m],c=dchg(T.m);
 return`<div class="bar">${BK('trade')}<b class="ttl">${m.s}</b></div>
<div class="big">${hp(m.p,m)}</div>${mv(c,m,0,10)}${candles({m:T.m,h:210,sl:T.sl,tp:T.tp})}${tbody()}`};
D.order=()=>({h:`<button class="btn ${T.side=='Sell'?'sell':''}" ${orderBad()?'disabled':''} onclick="review()">Review ${T.side.toLowerCase()}</button>`});
const review=()=>{
 const m=MK[T.m],bu=T.side=='Buy',px=m.p*(bu?1+SLIP:1-SLIP),fee=T.z*px*FEE,use=(nt()+T.z*m.p)/(2*eq())*100;
 sheet(`<div class="t2">${T.side} ${zf(T.z,m)}</div><div class="mu">Check the numbers, then confirm.</div><div style="margin-top:10px">${R('Estimated price','≈ '+pf(px,m))+R('Fee · 5 bps','$'+f2(fee))+R('Slippage · 2 bps','≈ $'+f2(T.z*m.p*SLIP))+R('Buying power used',Math.round(use)+'% of 2×')+R('Stop loss',tk(T.sl,m))+R('If your stop loss is hit',`<span class="rd">−${mm(tRisk())}</span>`,mm(tLeft())+' left today')}</div><div class="risk" style="margin-top:12px">${I('shield',20,'gn')}<span class="sm">Within your limits · Rules v1</span></div><button class="btn ${bu?'':'sell'}" style="margin-top:16px" onclick="fill()">Confirm ${T.side.toLowerCase()}</button>`)};
const fill=()=>{
 if(serverNeeded())return;
 const m=MK[T.m],bu=T.side=='Buy',px=m.p*(bu?1+SLIP:1-SLIP),fee=T.z*px*FEE;
 if(BerryAPI.online)return BerryAPI.order({market:T.m,side:T.side,size:T.z,stopLoss:T.sl,takeProfit:T.tp});
 S.pos.push({m:T.m,side:T.side,z:T.z,e:px,sl:T.sl,tp:T.tp});S.bal-=fee;S.rl-=fee;S.ord.unshift([T.side,T.z,px,'just now',T.m]);S.days=Math.max(S.days,1);S.tab='Position';S.m=T.m;
 go('trade');
 sheet(`<div class="ctr" style="padding-top:6px">${CK(44)}<div class="t2" style="margin-top:14px">Filled</div><div class="mu">${T.side} ${zf(T.z,m)} at ${pf(px,m)}</div></div><div style="margin-top:14px">${R('Fee','$'+f2(fee))+R('Stop loss',tk(T.sl,m))}</div><button class="btn" style="margin-top:18px" onclick="shut()">Done</button>`)};
/* ---------- Desktop: markets list, chart and ticket side by side ---------- */
const mkt=()=>{
 if(T.m!=S.m)newT(S.m);
 const k=S.m,m=MK[k],c=dchg(k),mine=S.pos.filter(p=>(p.m||'BTC')==k),oo=S.ord.filter(o=>(o[4]||'BTC')==k),pw=Math.max(420,CW()-392);
 const tb=S.tab=='Position'?(mine.length?mine.map(p=>posRow(p,S.pos.indexOf(p))).join(''):EMP('No open trades','Use the ticket to place one.')):S.tab=='Orders'?(oo.length?oo.map(ordRow).join(''):EMP('No orders yet','Your fills show up here.')):about(m);
 const tk2=paused()?`<div class="card col tk"><b>Trading is paused</b><div class="mu" style="margin-top:6px">Your payout request is open. Trading resumes once it is paid.</div></div>`:`<div class="card col tk"><b>Place a trade</b>${tbody()}<button class="btn ${T.side=='Sell'?'sell':''}" style="margin-top:16px" ${orderBad()?'disabled':''} onclick="review()">Review ${T.side.toLowerCase()}</button></div>`;
 return`${hdr(1)}<h1 style="margin:4px 0 18px">Markets</h1><div class="md"><aside>${mpane()}</aside>
<section class="mr"><div class="th"><div class="tn">${mi(k,48,held(k))}<div><div class="tt">${m.s}</div><div class="mu">${m.n}</div></div></div><div class="tpr"><div class="big" style="font-size:38px;margin:0">${hp(m.p,m)}</div>${mv(c,m,1,6)}</div></div>
${candles({m:k,vw:pw,h:300,sl:T.touch?T.sl:mine.length?mine[0].sl:null,tp:T.touch?T.tp:null})}<div class="tf" style="margin-top:6px">${TFS.map((t,i)=>`<button class="${i==S.tf?'on':''}" onclick="S.tf=${i};draw()">${t[0]}</button>`).join('')}</div>
<div class="cols t">${tk2}<div><div class="two" style="margin:0 0 14px"><div class="card col"><div class="mu sm">Daily loss left</div><b>${mm(dayLeft())}</b></div><div class="card col"><div class="mu sm">Max loss left</div><b>${mm(eq()-FLOOR)}</b></div></div>
<div class="tabs">${['Position','Orders','About'].map(t=>`<button class="${t==S.tab?'on':''}" onclick="S.tab='${t}';draw()">${t}</button>`).join('')}</div>${tb}</div></div></section></div>`};
/* ---------- Challenge passed ---------- */
const CALC=()=>({
 target:['Profit target',[['Net profit, after costs','$'+f2(1020*K())],['Target','$'+f2(START*.1)],['Result','Met']]],
 days:['Trading days',[['Fri 6 Nov','2 trades'],['Sat 7 Nov','1 trade'],['Sun 8 Nov','1 trade'],['Result','3 of 3 days']]],
 limits:['Loss limits',[['Worst day','−'+m0(212*K())+' of '+m0(DAILY)],['Lowest equity',m0(START*.974)+' (floor '+m0(FLOOR)+')'],['Result','Never reached']]],
 closed:['Positions closed',[['Open positions','None'],['Result','Ready']]]
});
const calc=k=>{const[t,rs]=CALC()[k];sheet(`<div class="t2">${t}</div><div class="mu">How Rules v1 worked it out.</div><div style="margin-top:10px">${rs.map(x=>R(x[0],x[1])).join('')}</div>`)};
const startFunded=()=>{if(serverNeeded())return;if(BerryAPI.online&&S.challengeId)return BerryAPI.fund(S.challengeId);PRE.funded();go('home');toast('Funded account started')};
V.passed=()=>`${hdr()}<div class="mid"><div class="ring"><span class="art i-chk" role="img" aria-label="Challenge passed" style="width:112px;height:112px"></span>${SPK([[10,18,16,0],[84,10,20,.9],[92,62,11,1.8],[4,72,12,2.6]])}</div><h1>Challenge passed</h1><div class="big gn">+${m0(1020*K())}</div></div>
<div class="tight" style="margin-top:18px">${[['Profit target','target'],['Trading days','days'],['Loss limits','limits'],['Positions closed','closed']].map(([a,k])=>R(a,ck,'',`calc('${k}')`)).join('')}</div>
<div class="card col" style="margin-top:18px"><b>What happens next</b>
<div class="r" style="min-height:50px;border:0">${I('layers',22,'bl')}<span>A new ${m0(START)} funded account starts</span></div>
<div class="r" style="min-height:50px;border:0">${I('lock',22,'bl')}<span>Challenge profit does not carry over</span></div>
<div class="r" style="min-height:50px;border:0">${I('shield',22,'bl')}<span>Passing never authorizes a payout</span></div></div>`;
D.passed=()=>({h:`<button class="btn" onclick="startFunded()">Start funded account</button>`});
/* ---------- Challenge failed ---------- */
const askPerson=()=>{if(serverNeeded())return;if(BerryAPI.online)return BerryAPI.appeal('Challenge review requested');S.appeal=1;draw();toast('Review requested')};
V.failed=()=>`${hdr(1)}<div style="position:relative"><span class="art i-arr" role="img" aria-label="Failed" style="position:absolute;right:-8px;top:-6px;width:96px;height:96px"></span><div class="mu">${SZ()} Challenge</div><h1 style="margin:4px 0 14px">Challenge failed</h1></div>
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px"><div><div class="big rd">−${m0(512*K())}</div><div class="mu" style="margin-top:8px">lost today · limit ${m0(DAILY)}</div></div>${TG('rd','Trading paused')}</div>
<div class="tight" style="margin-top:12px">${R('Max daily loss',m0(DAILY))+R('Reached at','14:21 UTC')}</div>
<div class="mu sm" style="margin:10px 0 18px">Recovering equity afterwards does not undo a breach.</div>

const swr=(on,f,k,s)=>`<button class="r" style="min-height:64px" role="switch" aria-checked="${on}" onclick="${f}"><span class="k" style="color:var(--tx)">${k}${s?`<span class="mu sm" style="display:block">${s}</span>`:''}</span><span class="sw" aria-hidden="true"></span></button>`;
const limStep=(k,s,key,d)=>`<div class="r" style="min-height:76px"><span class="k" style="color:var(--tx)">${k}<span class="mu sm" style="display:block">${s}</span></span><span class="stp"><b>${m0(S.cfg.lim[key])}</b><button aria-label="Lower ${k}" onclick="limSet('${key}',-${d})">${I('minus',18)}</button><button aria-label="Raise ${k}" onclick="limSet('${key}',${d})">${I('plus',18)}</button></span></div>`;
const limSet=(k,d)=>{const l=S.cfg.lim;l[k]=Math.max(Math.abs(d),l[k]+d);draw();if(BerryAPI.online)BerryAPI.updateRules(k=='pay'?{payoutCap:l[k]}:{aiCap:l[k]})};
const tgHalt=()=>{S.cfg.halt=S.cfg.halt?0:1;draw();if(BerryAPI.online)BerryAPI.updateRules({paused:Boolean(S.cfg.halt)});toast(S.cfg.halt?'Business paused':'Business resumed',S.cfg.halt?'warn':'ok')};
const tgSize=n=>{const c=S.cfg.sz;if(c[n]!==0&&SIZES.filter(s=>c[s]!==0).length<2)return toast('Keep at least one size on','warn');c[n]=c[n]===0?1:0;draw();if(BerryAPI.online)BerryAPI.updateRules({sizes:Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Boolean(v)]))})};
const tgMk=k=>{const c=S.cfg.mk;if(c[k]!==0&&Object.keys(MK).filter(x=>c[x]!==0).length<2)return toast('Keep at least one market on','warn');c[k]=c[k]===0?1:0;draw();if(BerryAPI.online)BerryAPI.updateRules({markets:Object.fromEntries(Object.entries(c).map(([x,v])=>[x,Boolean(v)]))})};
V.orules=()=>`${ohd('Rules','Version 1 · live')}<div class="mu sm" style="margin:-4px 0 12px">Switches change what traders can choose, right away. Fixed terms need a new version.</div>
${two(`<div class="sec">Limits</div>${swr(!S.cfg.halt,'tgHalt()','Business is running','Turn off to pause new challenges and payouts')}${limStep('Daily payout cap','Berry AI stops approving above it','pay',10)}${limStep('Daily AI spend cap','Berry AI stops spending above it','ai',1)}
<div class="sec">Account sizes</div>${SIZES.map(n=>swr(S.cfg.sz[n]!==0,`tgSize(${n})`,m0(n)+' account','Target '+m0(n*.1)+' · Daily loss '+m0(n*.05)+(BERRY.fees[n]?' · Fee '+mm(BERRY.fees[n]):''))).join('')}
<div class="sec">Fixed in Rules v1</div>${R('Profit target','10% of the account')+R('Daily loss limit','5% · from UTC day start')+R('Max loss','10% below the start')+R('Trading days','3 with a trade')+R('Costs','5 bps fee · 2 bps slippage')+R('Max exposure','2× equity')+R('Payout',PAYT())}
<div class="mu sm" style="margin-top:14px">Traders already in a challenge keep the rules they accepted.</div>`,`<div class="sec">Markets<span class="tg mu">${Object.keys(MK).filter(k=>S.cfg.mk[k]!==0).length} of ${Object.keys(MK).length} on</span></div>
${CATS.map(c=>`<div class="mu sm" style="margin:14px 0 0;font-weight:700">${c}</div>${Object.keys(MK).filter(k=>MK[k].c==c).map(k=>swr(S.cfg.mk[k]!==0,`tgMk('${k}')`,MK[k].s,MK[k].n)).join('')}`).join('')}`,'e')}`;
/* ---------- Server adapter ----------
   The UI remains intentionally lightweight; this adapter is the only browser
   entry point for state-changing actions when BERRY.api is enabled. */
const BerryAPI=(()=>{
 let online=false,loading=false;
 const fail=e=>{console.warn('Berry API',e);const message=String(e?.message||'');const copy=/ai api key|berry ai.*key/i.test(message)?'Add the AI key and restart.':/treasury.*insufficient|insufficient.*usdc/i.test(message)?'Treasury needs funding.':/near intents|payment service/i.test(message)?'Payment service unavailable.':/mainnet account/i.test(message)?'Use a NEAR mainnet account.':/paused/i.test(message)?'Payouts are paused.':/already have an active|account already active/i.test(message)?'Account already active. Resume it.':/failed to fetch|network|fetch|connection|reach/i.test(message)?'Server unavailable. Refresh.':'Couldn’t complete that. Try again.';toast(copy,'err')};
 const call=async(path,o={})=>{
  const r=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json',...(o.headers||{})},...o});
  const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||'Request failed');return x
 };
 const agoAt=at=>Math.max(0,(Date.now()-new Date(at).getTime())/36e5);
 const payState=s=>({requested:'review',approved:'approved',sending:'sending',paid:'paid',rejected:'rejected',escalated:'escalated'})[s]||'idle';
 const setBusiness=(key,b)=>{S.business=S.business||{};S.business[key]={per:key,sold:b.sold,bySize:b.bySize||{},statuses:b.statuses||{},sales:b.sales,pay:b.payouts.amount,np:b.payouts.count,ai:b.ai,host:b.hosting,cost:b.costs,net:b.net,keep:b.sales?b.net/b.sales:0};S.trends=S.trends||{};S.trends[key]=b.series};
 const applyMe=me=>{
  S.preview=false;S.aiReady=!!me.aiReady;S.nearIntentsConfigured=!!me.nearIntentsConfigured;S.challengePayment=me.pendingChallengePayment||null;BERRY.user.name=me.user.wallet;BERRY.user.role=me.user.role;BERRY.share=me.settings.revenueShare;BERRY.cap=me.settings.accountPayoutCap;BERRY.fees=me.settings.challengeFees;BERRY.treasury=me.treasury||'';S.rail=me.rail||'mock';S.settlementNetwork=me.settlementNetwork||'Treasury rail';
  S.cfg={halt:me.settings.paused?1:0,lim:{pay:me.settings.payoutCap,ai:me.settings.aiCap},sz:Object.fromEntries(Object.entries(me.settings.sizes).map(([k,v])=>[k,v?1:0])),mk:Object.fromEntries(Object.entries(me.settings.markets).map(([k,v])=>[k,v?1:0]))};
  Object.entries(me.prices||{}).forEach(([k,v])=>{if(MK[k])MK[k].p=Number(v)});
  S.pool=me.pool||{inp:0,res:0,snd:0,paid:[]};
  const c=me.challenge;
  if(!c){Object.assign(S,{challengeId:null,stage:'none',bal:0,rl:0,days:0,pos:[],ord:[],pay:'idle',amt:0,net:0,t:{}});return}
  setSize(Number(c.size));
  S.challengeId=c.id;S.stage=c.status==='active'?'challenge':c.status;
  S.bal=Number(c.balance);S.rl=Number(c.realised_loss);S.days=Number(c.trading_days);
  S.pos=(c.positions||[]).map(p=>({id:p.id,m:p.market,side:p.side,z:Number(p.size),e:Number(p.entry_price),sl:p.stop_loss==null?null:Number(p.stop_loss),tp:p.take_profit==null?null:Number(p.take_profit)}));
  S.ord=(c.orders||[]).filter(p=>p.status==='closed').map(p=>[p.side==='Buy'?'Sell':'Buy',Number(p.size),Number(p.close_price||p.entry_price),new Date(p.closed_at||p.opened_at).toLocaleString(),p.market]);
  const p=me.payout;S.pay=p?payState(p.status):'idle';S.amt=p?Number(p.amount):0;S.net=S.amt;S.t=p?{req:p.created_at,ok:p.updated_at,paid:p.status==='paid'?p.updated_at:''}:{};S.apiPayout=p||null;S.apiDecision=p?{by:p.decision_by,reason:p.reason}:null;
 };
 const refresh=async({render=true,ops=true}={})=>{
  const me=await call('/api/me');applyMe(me);
  if(ops&&me.user.role==='owner'){
   const [today,week,all,rows,cases,accounts]=await Promise.all([
    call('/api/ops/business?per=today'),call('/api/ops/business?per=7d'),call('/api/ops/business?per=all'),call('/api/ledger'),call('/api/ops/cases'),call('/api/ops/accounts')
   ]);
   setBusiness('Today',today);setBusiness('7D',week);setBusiness('All',all);
   S.ledger=rows.map(x=>[x.type==='payout'?'pay':x.type,x.label,x.detail,x.amount,x.ref||'',agoAt(x.at),x.metadata||{}]);
   S.caseMap=Object.fromEntries(cases.map(x=>[x.id,x]));S.own={need:cases.map(x=>x.id),done:Math.max(0,all.decisions-cases.length),min:0};
   S.accounts=accounts.map(x=>[x.id,x.size,x.status==='funded'?'Funded':'Challenge',x.balance,x.status==='failed'?'Failed':x.status==='passed'?'Passed':x.status==='funded'?'Active':'Active']);
  }else{S.ledger=(await call('/api/ledger')).map(x=>[x.type==='payout'?'pay':x.type,x.label,x.detail,x.amount,x.ref||'',agoAt(x.at),x.metadata||{}])}
  if(render)draw();return me
 };
 const perform=async(fn)=>{try{return await fn()}catch(e){fail(e);return null}};
 const api={
  get online(){return online&&!S.preview},
  get required(){return BERRY.api!==false&&!S.preview},
  async init(){
   if(BERRY.api===false||location.protocol==='file:')return;
   if(loading)return;loading=true;
   try{await call('/api/auth/session',{method:'POST'});online=true;await refresh({render:true})}
   catch(e){online=false;console.warn('Berry API unavailable.',e);if(BERRY.api!==false)toast('Server unavailable. Refresh.','err')}finally{loading=false}
  },
  refresh,
  createChallenge:size=>perform(async()=>{const result=await call('/api/challenges',{method:'POST',body:JSON.stringify({size})});await refresh({render:false});go('home');toast(result.reused?'Account resumed':'Free test account started')}),
  payChallenge:(size,refundTo)=>perform(async()=>{const result=await call('/api/challenges/payment-quote',{method:'POST',body:JSON.stringify({size,refundTo})});S.challengePayment=result.payment;paymentSheet(result.payment)}),
  checkChallengePayment:id=>perform(async()=>{const result=await call('/api/challenges/payments/'+encodeURIComponent(id));S.challengePayment={...S.challengePayment,...result.payment};if(result.payment.status==='paid'){await refresh({render:false});shut();go('home');toast('Payment confirmed · account started')}else{paymentSheet(S.challengePayment);toast(result.payment.providerStatus==='FAILED'||result.payment.providerStatus==='REFUNDED'?'Payment did not complete.':'Payment not confirmed yet.','info')}}),
  order:input=>perform(async()=>{await call('/api/orders',{method:'POST',body:JSON.stringify(input)});await refresh({render:false});go('trade');toast('Order filled at the server price')}),
  updatePosition:(id,stopLoss)=>perform(async()=>{await call('/api/positions/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({stopLoss})});await refresh({render:false});shut();draw();toast('Stop loss updated')}),
  closePosition:(id,fraction)=>perform(async()=>{const r=await call('/api/positions/'+encodeURIComponent(id)+'/close',{method:'POST',body:JSON.stringify({fraction})});await refresh({render:false});shut();draw();toast((fraction>=.999?'Closed':'Partly closed')+' position · '+sg(r.pnl))}),
  fund:id=>perform(async()=>{await call('/api/challenges/'+encodeURIComponent(id)+'/fund',{method:'POST'});await refresh({render:false});go('home');toast('Funded account started')}),
  requestPayout:wallet=>perform(async()=>{const r=await call('/api/payouts',{method:'POST',body:JSON.stringify({wallet})});await refresh({render:false});S.apiDecision=r.decision;go('payout');toast(r.payout.status==='approved'?'Payout approved':r.payout.reason||'Payout needs review',r.payout.status==='approved'?'ok':'warn')}),
  reviewPayout:id=>perform(async()=>{const r=await call('/api/payouts/'+encodeURIComponent(id)+'/review',{method:'POST'});await refresh({render:false});S.apiDecision=r.decision;go('payout');toast(r.payout.status==='approved'?'Berry AI approved payout':'Payout needs review',r.payout.status==='approved'?'ok':'warn')}),
  confirmPayout:id=>perform(async()=>{await call('/api/payouts/'+encodeURIComponent(id)+'/confirm',{method:'POST'});await refresh({render:false});draw();toast(S.rail==='testnet'?'Testnet payout settled':'Payout settled')}),
  appeal:message=>perform(async()=>{await call('/api/appeals',{method:'POST',body:JSON.stringify({message})});S.appeal=1;draw();toast('Appeal sent to the owner queue')}),
  updateRules:patch=>perform(async()=>{await call('/api/ops/rules',{method:'PATCH',body:JSON.stringify(patch)});await refresh();}),
  resolveCase:(id,action,reason)=>perform(async()=>{await call('/api/ops/cases/'+encodeURIComponent(id)+'/resolve',{method:'POST',body:JSON.stringify({action,reason})});await refresh({render:false});go('queue');toast('Case updated')}),
  seed:()=>perform(async()=>{await call('/api/demo/seed',{method:'POST'});const r=await call('/api/payouts',{method:'POST',body:'{}'});await refresh({render:false});S.apiDecision=r.decision;go('payout');toast(r.payout.status==='approved'?'Berry AI approved payout':'Payout needs review',r.payout.status==='approved'?'ok':'warn')}),
  resetDemo:()=>perform(async()=>{await call('/api/demo/reset',{method:'POST'});await refresh({render:false});go('start');toast('Demo reset · ledger evidence kept')})
 };
 window.BerryAPI=api;return api;
})();
/* ---------- Boot: #hash opens a screen directly ----------
   With BERRY.demo on (this preview) every route can load a ready-made state. With it off, only the real screens open
   and nothing is pre-filled: your backend supplies the state. */
const pre=n=>{if(BERRY.demo)PRE[n]()};
const ROUTES={start:()=>go('start'),home:()=>{pre('active');go('home')},markets:()=>{pre('active');go('markets')},trade:()=>{pre('active');go('trade',{m:'BTC'})},order:()=>{pre('active');S.m='BTC';openOrder('Buy')},passed:()=>{pre('passed');go('passed')},failed:()=>go('failed'),payouts:()=>{pre('funded');go('pay')},locked:()=>{pre('active');go('pay')},payout:()=>{pre('funded');startPay()},pool:()=>go('pool'),help:()=>{pre('active');go('help')},profile:()=>go('me'),owner:()=>go('owner'),business:()=>go('owner'),ledger:()=>go('ledger',{from:'owner'}),queue:()=>go('queue'),accounts:()=>go('accts'),rules:()=>go('orules')};
const LIVE=['start','home','markets','payouts','pool','help','profile','owner','business','ledger','queue','accounts','rules'];
const route=first=>{const k=location.hash.slice(1),f=ROUTES[k];if(f&&(BERRY.demo||LIVE.includes(k)))f();else if(first)ROUTES.start()};
addEventListener('hashchange',()=>route());route(1);
if(typeof BerryAPI!='undefined')BerryAPI.init();
</script>
